name: Actualizar Datos Meteorológicos

on:
  schedule:
    # Ejecuta cada 30 minutos
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '*.json'
      - '*.csv'
      - 'README.md'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install openpyxl

      - name: Ejecutar Extractor de Datos
        run: |
          python actualizar_datos.py

      - name: Auto-Commit de Datos Actualizados
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto-actualización de datos meteorológicos [skip ci]'
          file_pattern: '*.json *.csv *.xlsx'
